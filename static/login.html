<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipForge — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0a;color:#e8e8e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.box{background:#111;border:1px solid #222;border-radius:16px;padding:40px;width:100%;max-width:360px;text-align:center;}
.logo{font-size:28px;font-weight:800;color:#fff;margin-bottom:6px;}
.logo span{color:#f97316;}
.sub{font-size:13px;color:#666;margin-bottom:32px;}
input{width:100%;background:#0d0d0d;border:1px solid #222;border-radius:8px;color:#fff;font-size:14px;padding:12px 14px;outline:none;margin-bottom:12px;font-family:inherit;}
input:focus{border-color:#f97316;}
button{width:100%;background:linear-gradient(135deg,#f97316,#fbbf24);border:none;border-radius:8px;color:#000;font-size:14px;font-weight:800;padding:12px;cursor:pointer;font-family:inherit;}
button:hover{opacity:.88;}
.err{color:#f87171;font-size:12px;margin-top:10px;display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Clip<span>Forge</span></div>
  <div class="sub">Video Clipping Platform</div>
  <input type="password" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Enter</button>
  <div class="err" id="err">Incorrect password</div>
</div>
<script>
async function login(){
  const pw=document.getElementById('pw').value;
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(r.ok){const d=await r.json();window.location.href=d.redirect;}
  else{document.getElementById('err').style.display='block';document.getElementById('pw').value='';}
}
</script>
</body>
</html>
