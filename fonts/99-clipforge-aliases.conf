<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Map the font names offered in the editor to the free fonts we ship. -->
<fontconfig>
  <alias binding="same"><family>Impact</family><prefer><family>Anton</family></prefer></alias>
  <alias binding="same"><family>Arial Black</family><prefer><family>Archivo Black</family></prefer></alias>
  <alias binding="same"><family>Arial Rounded MT Bold</family><prefer><family>Archivo Black</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
